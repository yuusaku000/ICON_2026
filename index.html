<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームハブ</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="demo-banner" class="banner" hidden>
    デモモード：<code>firebase-config.js</code> がまだ空なので、このブラウザの中だけに保存しています（編集パスワードは <b>demo</b>）
  </div>

  <header class="top">
    <h1 id="site-title">ゲームハブ</h1>
    <div id="admin-bar" class="admin-bar" hidden>
      <span class="badge">編集中</span>
      <button id="add-btn" type="button">＋ ゲームを追加</button>
      <button id="logout-btn" type="button" class="ghost">編集を終える</button>
    </div>
  </header>

  <main>
    <p id="status" class="status">読み込み中…</p>
    <ul id="grid" class="grid"></ul>
  </main>

  <footer class="foot">
    <button id="edit-link" type="button" class="edit-link">編集</button>
  </footer>

  <!-- ゲームの詳細 -->
  <dialog id="detail" class="modal detail">
    <div class="modal-inner">
      <button type="button" class="close" data-close aria-label="閉じる">×</button>
      <div id="d-thumb" class="d-thumb"></div>
      <div class="d-body">
        <h2 id="d-title"></h2>
        <section id="d-controls-wrap">
          <h3>操作方法</h3>
          <p id="d-controls" class="pre"></p>
        </section>
        <section id="d-desc-wrap">
          <h3>説明</h3>
          <p id="d-desc" class="pre"></p>
        </section>
      </div>
      <div class="d-foot">
        <a id="d-play" class="play" target="_blank" rel="noopener noreferrer">▶ 遊ぶ</a>
      </div>
    </div>
  </dialog>

  <!-- 編集のログイン -->
  <dialog id="login" class="modal narrow">
    <form id="login-form" class="modal-inner form">
      <h2>編集する</h2>
      <label>パスワード
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <p id="l-error" class="error"></p>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="ghost" data-close>キャンセル</button>
        <button type="submit">ログイン</button>
      </div>
    </form>
  </dialog>

  <!-- ゲームの追加・編集 -->
  <dialog id="editor" class="modal">
    <form id="edit-form" class="modal-inner form" novalidate>
      <h2 id="e-heading">ゲームを追加</h2>
      <label>タイトル
        <input name="title" required maxlength="60">
      </label>
      <label>unityroom の URL
        <input name="url" type="url" required placeholder="https://unityroom.com/games/...">
      </label>
      <div class="field">
        <span>サムネイル</span>
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="サムネイル画像を選ぶ">
          <img id="e-thumb" alt="" hidden>
          <p id="drop-hint">画像をドラッグ、クリックで選ぶ、または貼り付け（Ctrl+V）</p>
        </div>
        <input id="file" type="file" accept="image/*" hidden>
        <button id="thumb-clear" type="button" class="ghost small" hidden>サムネイルを外す</button>
      </div>
      <label>操作方法
        <textarea name="controls" rows="3" placeholder="矢印キー：移動　スペース：ジャンプ"></textarea>
      </label>
      <label>説明
        <textarea name="description" rows="5"></textarea>
      </label>
      <p id="e-error" class="error"></p>
      <div class="actions">
        <button id="e-delete" type="button" class="danger">削除</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" data-close>キャンセル</button>
        <button id="e-save" type="submit">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
